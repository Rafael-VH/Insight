<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Diagramas · Insight</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --fondo: #f4f6f8; --superficie: #ffffff; --borde: #e3e7ec;
    --texto: #131820; --texto-suave: #5c6674;
    --acento: #0d6e63; --acento-texto: #ffffff;
  }
  :root[data-theme="dark"] {
    --fondo: #0d1117; --superficie: #161b22; --borde: #272e38;
    --texto: #e6edf5; --texto-suave: #9aa6b4;
    --acento: #2dd4bf; --acento-texto: #06231f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
    background: var(--fondo); color: var(--texto);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .tarjeta {
    max-width: 30rem; text-align: center; padding: 2.5rem 1.75rem;
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px;
  }
  h1 { margin: 0 0 .6rem; font-size: 1.5rem; }
  p { margin: 0 0 1.5rem; color: var(--texto-suave); }
  a.boton {
    display: inline-block; padding: .6rem 1.1rem; border-radius: 9px;
    background: var(--acento); color: var(--acento-texto);
    font-weight: 600; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <h1>Página no encontrada</h1>
    <p>La dirección que abriste no existe en este sitio.</p>
    <a class="boton" href="/Insight/">Ir al dashboard de diagramas</a>
  </div>
</body>
</html>
